spring.application.name=ecommerce

# --- Base de datos desactivada temporalmente (repositorios en memoria). Se reemplaza al conectar JPA/H2. ---
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Sesión (JWT HS256). En producción define GLOW_JWT_SECRET (mínimo 32 caracteres). ---
glow.jwt.secret=${GLOW_JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
glow.jwt.expiracion-minutos=60

# --- Primer administrador (se crea al arrancar si no existe). En producción usa variables de entorno. ---
glow.admin.nombre=Administrador
glow.admin.email=${GLOW_ADMIN_EMAIL:admin@glowshop.com}
glow.admin.password=${GLOW_ADMIN_PASSWORD:Admin12345}
glow.admin.telefono=3000000000
glow.admin.fecha-nacimiento=1990-01-01
