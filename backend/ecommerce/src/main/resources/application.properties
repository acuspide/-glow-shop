spring.application.name=ecommerce

# --- Base de datos H2 (en memoria). Se crea al arrancar y se borra al apagar la app. ---
spring.datasource.url=jdbc:h2:mem:glowshop
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:glowshop) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Sesión (JWT HS256). En producción define GLOW_JWT_SECRET (mínimo 32 caracteres). ---
glow.jwt.secret=${GLOW_JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
glow.jwt.expiracion-minutos=60

# --- Primer administrador (se crea al arrancar si no existe). En producción usa variables de entorno. ---
glow.admin.nombre=Administrador
glow.admin.email=${GLOW_ADMIN_EMAIL:admin@glowshop.com}
glow.admin.password=${GLOW_ADMIN_PASSWORD:Admin12345}
glow.admin.telefono=3000000000
glow.admin.fecha-nacimiento=1990-01-01
